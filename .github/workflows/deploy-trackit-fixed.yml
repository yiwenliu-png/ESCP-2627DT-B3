name: Deploy TrackIt fixed
on:
  push:
    branches: [feature/trackit-prototype, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
        working-directory: prototype
      - run: npm run build
        working-directory: prototype
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist
      - uses: actions/deploy-pages@v4